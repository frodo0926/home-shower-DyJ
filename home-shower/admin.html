<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Bitácora · Home Shower</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #FBF7F4;
      --blush: #E8D8CE;
      --rose: #B98F88;
      --taupe: #7A6258;
      --ink: #3B2F2A;
      --surface: #FFFCFA;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Outfit, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 36px 20px 64px; }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 500;
      font-size: clamp(28px, 5vw, 42px);
      margin: 0 0 6px;
    }
    .lead { color: var(--taupe); margin: 0 0 22px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--blush);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 16px 36px rgba(59,47,42,.08);
      max-width: 400px;
    }
    label { display: block; font-size: 13px; color: var(--taupe); margin: 10px 0 6px; }
    input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--blush);
      border-radius: 12px;
      font-family: Outfit, sans-serif;
      font-size: 15px;
    }
    button {
      margin-top: 16px;
      border: none;
      background: var(--ink);
      color: var(--paper);
      font-family: Outfit, sans-serif;
      font-weight: 600;
      padding: 11px 16px;
      border-radius: 12px;
      cursor: pointer;
    }
    button.ghost {
      background: transparent;
      color: var(--ink);
      border: 1.5px solid var(--blush);
    }
    button.on {
      background: var(--ink);
      color: var(--paper);
      border-color: var(--ink);
    }
    .err { color: #9a3b32; font-size: 14px; margin-top: 10px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .toolbar button { margin-top: 0; }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--blush);
      font-size: 14px;
    }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--blush); vertical-align: top; }
    th { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--taupe); }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
    }
    .pill.elegir, .pill.confirmar { background: #e8d8ce; color: var(--ink); }
    .pill.devolver, .pill.declinar, .pill.intento { background: #f3ece8; color: var(--taupe); }
    .empty { color: var(--taupe); font-family: Fraunces, Georgia, serif; padding: 28px; text-align: center; }
    .hidden { display: none; }
    .msg { max-width: 280px; color: var(--taupe); font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Bitácora del hogar</h1>
    <p class="lead">Solo anfitriones. Regalos del home shower e invitaciones de la boda.</p>

    <div id="loginView" class="card">
      <label for="user">Usuario</label>
      <input id="user" autocomplete="username" />
      <label for="pass">Clave</label>
      <input id="pass" type="password" autocomplete="current-password" />
      <button type="button" id="loginBtn">Entrar</button>
      <p class="err hidden" id="loginErr">Usuario o clave no coinciden.</p>
    </div>

    <div id="logsView" class="hidden">
      <div class="toolbar">
        <button type="button" id="viewHogarBtn" class="ghost on">Bitácora del hogar</button>
        <button type="button" id="viewRsvpBtn" class="ghost">Bitácora invitaciones</button>
        <button type="button" id="refreshBtn">↻ Actualizar</button>
        <button type="button" class="ghost" id="logoutBtn">Cerrar sesión</button>
      </div>
      <div id="tableBox"></div>
    </div>
  </div>

  <script>
    const CONFIG = {
      apiUrl: "https://script.google.com/macros/s/AKfycbyT4YjFX5Eix0I2C0Z4jGSjeWzFE4y6AYcUCh2rpbxcynCLhyhfJvVS3nzr2xs-0AA1Tg/exec"
    };

    let view = "hogar";

    async function sha256hex(str) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
      return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
    }

    function creds() {
      try { return JSON.parse(sessionStorage.getItem("hs-admin") || "null"); }
      catch (e) { return null; }
    }

    function showLogin(err) {
      document.getElementById("loginView").classList.remove("hidden");
      document.getElementById("logsView").classList.add("hidden");
      const box = document.getElementById("loginErr");
      box.classList.toggle("hidden", !err);
    }

    function showLogs() {
      document.getElementById("loginView").classList.add("hidden");
      document.getElementById("logsView").classList.remove("hidden");
    }

    function setView(next) {
      view = next;
      document.getElementById("viewHogarBtn").classList.toggle("on", view === "hogar");
      document.getElementById("viewRsvpBtn").classList.toggle("on", view === "invitaciones");
      loadLogs();
    }

    let lastAuthError = "";

    async function login() {
      lastAuthError = "";
      if (!CONFIG.apiUrl) {
        document.getElementById("loginErr").textContent = "Falta pegar la URL /exec en CONFIG.apiUrl de esta página.";
        showLogin(true);
        return;
      }
      const uh = await sha256hex(document.getElementById("user").value.trim());
      const ph = await sha256hex(document.getElementById("pass").value);
      sessionStorage.setItem("hs-admin", JSON.stringify({ uh, ph }));
      const ok = await loadLogs();
      if (!ok) {
        sessionStorage.removeItem("hs-admin");
        document.getElementById("loginErr").textContent = lastAuthError || "Usuario o clave no coinciden.";
        showLogin(true);
        return;
      }
      document.getElementById("pass").value = "";
      showLogs();
    }

    function pillHogar(accion) {
      if (accion === "devolver") return ["devolver", "Devuelto"];
      if (accion === "intento") return ["intento", "Intento"];
      return ["elegir", "Elegido"];
    }
    function pillRsvp(accion) {
      if (accion === "declinar") return ["declinar", "No asiste"];
      return ["confirmar", "Confirmó"];
    }

    function tableHogar(rows) {
      if (!rows.length) {
        return '<p class="empty">Aún no hay movimientos. Cuando alguien elija o devuelva un detalle, aparecerá aquí.</p>';
      }
      return `<table>
        <thead><tr><th>Fecha</th><th>Acción</th><th>Detalle</th><th>Nombre</th><th>Id</th></tr></thead>
        <tbody>${rows.map(r => {
          const [cls, label] = pillHogar(r.accion);
          return `<tr>
            <td>${esc(r.fecha)}</td>
            <td><span class="pill ${cls}">${label}</span></td>
            <td>${esc(r.articulo)}</td>
            <td>${esc(r.nombre)}</td>
            <td>${esc(r.id)}</td>
          </tr>`;
        }).join("")}</tbody>
      </table>`;
    }

    function tableRsvp(rows) {
      if (!rows.length) {
        return '<p class="empty">Aún no hay confirmaciones de la boda. Cuando alguien envíe el formulario, aparecerá aquí.</p>';
      }
      return `<table>
        <thead><tr><th>Fecha</th><th>Acción</th><th>Nombre</th><th>Asiste</th><th>Invitados</th><th>Mensaje</th></tr></thead>
        <tbody>${rows.map(r => {
          const [cls, label] = pillRsvp(r.accion);
          return `<tr>
            <td>${esc(r.fecha)}</td>
            <td><span class="pill ${cls}">${label}</span></td>
            <td>${esc(r.nombre)}</td>
            <td>${esc(r.asiste)}</td>
            <td>${esc(r.invitados)}</td>
            <td class="msg">${esc(r.mensaje)}</td>
          </tr>`;
        }).join("")}</tbody>
      </table>`;
    }

    async function loadLogs() {
      const c = creds();
      const box = document.getElementById("tableBox");
      if (!CONFIG.apiUrl || !c) {
        box.innerHTML = '<p class="empty">Falta pegar la URL /exec en CONFIG.apiUrl de esta página.</p>';
        lastAuthError = "Falta pegar la URL /exec en CONFIG.apiUrl de esta página.";
        return false;
      }
      box.innerHTML = '<p class="empty">Leyendo la bitácora…</p>';
      try {
        const url = new URL(CONFIG.apiUrl);
        url.searchParams.set("action", view === "invitaciones" ? "rsvpLogs" : "logs");
        url.searchParams.set("uh", c.uh);
        url.searchParams.set("ph", c.ph);
        const res = await fetch(url.toString());
        const data = await res.json();
        if (Array.isArray(data.regalos) && data.eventos === undefined) {
          lastAuthError = "El puente de Google aún no tiene la bitácora. En Apps Script pega el Code.gs nuevo y luego Implementar → Administrar implementaciones → lápiz → Nueva versión.";
          sessionStorage.removeItem("hs-admin");
          showLogin(true);
          return false;
        }
        if (!data.success) {
          lastAuthError = data.error === "unauthorized"
            ? "Usuario o clave no coinciden."
            : ("No se pudo abrir la bitácora: " + (data.error || "error"));
          sessionStorage.removeItem("hs-admin");
          showLogin(true);
          return false;
        }
        const rows = data.eventos || [];
        box.innerHTML = view === "invitaciones" ? tableRsvp(rows) : tableHogar(rows);
        return true;
      } catch (e) {
        box.innerHTML = '<p class="empty">No se pudo leer la bitácora. Revisa la URL /exec.</p>';
        return false;
      }
    }

    function esc(s) {
      const d = document.createElement("div");
      d.innerText = s == null ? "" : String(s);
      return d.innerHTML;
    }

    document.getElementById("loginBtn").addEventListener("click", login);
    document.getElementById("pass").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
    document.getElementById("refreshBtn").addEventListener("click", loadLogs);
    document.getElementById("viewHogarBtn").addEventListener("click", () => setView("hogar"));
    document.getElementById("viewRsvpBtn").addEventListener("click", () => setView("invitaciones"));
    document.getElementById("logoutBtn").addEventListener("click", () => {
      sessionStorage.removeItem("hs-admin");
      showLogin(false);
    });

    if (creds()) {
      showLogs();
      loadLogs();
    }
  </script>
</body>
</html>
