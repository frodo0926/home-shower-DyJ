<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de iconos · Home Shower</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #FBF7F4;
      --blush: #E8D8CE;
      --rose: #B98F88;
      --taupe: #7A6258;
      --ink: #3B2F2A;
      --surface: #FFFCFA;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Outfit, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 36px 20px 80px; }
    a.back { color: var(--taupe); font-size: 14px; text-decoration: none; }
    h1 {
      font-family: Fraunces, Georgia, serif;
      font-weight: 500;
      font-size: clamp(32px, 5vw, 48px);
      margin: 10px 0 6px;
    }
    .lead { color: var(--taupe); max-width: 640px; line-height: 1.6; margin-bottom: 22px; }
    code, .name {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .bar {
      display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .bar input, .bar select {
      padding: 11px 14px;
      border: 1.5px solid var(--blush);
      border-radius: 12px;
      background: var(--surface);
      font-family: Outfit, sans-serif;
      font-size: 15px;
      color: var(--ink);
    }
    .bar input { flex: 1; min-width: 220px; }
    .count { font-size: 13px; color: var(--taupe); align-self: center; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
    .chip {
      border: 1px solid var(--blush);
      background: transparent;
      color: var(--taupe);
      border-radius: 999px;
      padding: 7px 12px;
      cursor: pointer;
      font-family: Outfit, sans-serif;
      font-size: 13px;
    }
    .chip.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--blush);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 10px 24px rgba(59,47,42,.06);
    }
    .icon-well {
      width: 120px; height: 120px; border-radius: 50%;
      display: grid; place-items: center;
      background: transparent;
      overflow: hidden;
      margin: 0 auto;
    }
    .icon-well img { width: 120px; height: 120px; object-fit: contain; display: block; }
    .cat {
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--rose);
      font-weight: 600;
    }
    .name {
      font-size: 18px;
      color: var(--ink);
    }
    .desc { font-size: 14px; color: var(--taupe); line-height: 1.4; min-height: 38px; }
    .copy {
      margin-top: auto;
      border: none;
      background: var(--ink);
      color: var(--paper);
      border-radius: 10px;
      padding: 9px 12px;
      cursor: pointer;
      font-family: Outfit, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
    .copy:hover { background: #2a211e; }
    .toast {
      position: fixed; left: 50%; bottom: 22px;
      transform: translateX(-50%) translateY(16px);
      background: var(--ink); color: var(--paper);
      padding: 10px 16px; border-radius: 999px;
      opacity: 0; transition: .3s; z-index: 20; font-size: 14px;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

    <a class="back" href="index.html">← Volver al Home Shower</a>
    <h1>Catálogo de iconos</h1>

      Pulsa <em>Copiar nombre</em> y pégalo en el Excel exactamente así, en minúsculas.
    </p>
    <div class="bar">
      <input id="q" type="search" placeholder="Buscar por nombre, categoría o descripción…" />
      <span class="count" id="count"></span>
    </div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="toast" id="toast"></div>

    let filtro = "Todas";
    const cats = ["Todas", ...new Set(CATALOG.map(i => i.cat))];

    function toast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 1800);
    }

    async function copyName(id) {
      try {
        await navigator.clipboard.writeText(id);
        toast("Copiado para Excel: " + id);
      } catch (e) {
        prompt("Copia este nombre para la columna icon:", id);
      }
    }

    function render() {
      const q = document.getElementById("q").value.trim().toLowerCase();
      document.getElementById("chips").innerHTML = cats.map(c =>
        `<button class="chip ${c === filtro ? "active" : ""}" data-cat="${c}">${c}</button>`
      ).join("");
      document.querySelectorAll(".chip").forEach(b => b.onclick = () => { filtro = b.dataset.cat; render(); });

      const items = CATALOG.filter(i => {
        if (filtro !== "Todas" && i.cat !== filtro) return false;
        if (!q) return true;
        return (i.id + " " + i.cat + " " + i.desc).toLowerCase().includes(q);
      });
      document.getElementById("count").textContent = items.length + " iconos";
      document.getElementById("grid").innerHTML = items.map(i => `
        <article class="card">
          <div class="icon-well">
            <img src="images/icons/${i.id}.png" alt="${i.id}" onerror="this.onerror=null;this.src='images/icons/gift.png'">
          </div>
          <div class="cat">${i.cat}</div>
          <div class="name">${i.id}</div>
          <p class="desc">${i.desc}<br><span style="font-size:12px">Excel: columna icon = <strong>${i.id}</strong></span></p>
          <button class="copy" type="button" data-id="${i.id}">Copiar nombre para Excel</button>
        </article>
      `).join("");
      document.querySelectorAll(".copy").forEach(b => b.onclick = () => copyName(b.dataset.id));
      document.querySelectorAll(".card").forEach(card => {
        card.style.cursor = "pointer";
        card.onclick = (e) => {
          if (e.target.closest(".copy")) return;
          const id = card.querySelector(".copy").dataset.id;
          copyName(id);
        };
      });
    }

    document.getElementById("q").addEventListener("input", render);
    render();
  </script>
